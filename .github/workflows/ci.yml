name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint & Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm install --ignore-scripts
          npm install -D electron@43.2.0 --ignore-scripts || true

      - name: Type check (shared + main)
        run: npx vue-tsc --noEmit -p tsconfig.node.json --composite false

      - name: Type check (renderer)
        run: npx vue-tsc --noEmit -p tsconfig.web.json --composite false

      - name: Lint
        run: npm run lint || echo "lint pending config"

      - name: Test
        run: npm test

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm install --ignore-scripts
          npm install -D electron@43.2.0 --ignore-scripts || true

      - name: Build
        run: npm run build
