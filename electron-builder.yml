appId: com.justclaw.app
productName: JustClaw
copyright: Copyright © 2026 JustClaw

directories:
  buildResources: build
  output: release

icon: build/icon.png
# icns: build/icon.icns  # macOS: uncomment and generate icon.icns if needed

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{ts,mjs,cts}'
  - '!{.eslintignore,.eslintrc.mjs,.prettierignore,.prettierrc.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

win:
  executableName: just-claw
  target:
    - target: nsis
      arch:
        - x64

compression: maximum

nsis:
  artifactName: just-claw-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: just-claw.${ext}

dmg:
  artifactName: just-claw.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: just-claw.${ext}

publish:
  provider: github
  owner: justclaw
  repo: justclaw
  releaseType: release
