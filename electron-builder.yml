appId: com.justclaw.app
productName: JustClaw
copyright: Copyright © 2026 JustClaw

directories:
  buildResources: build
  output: release

icon: build/icon.png

electronDist: ./node_modules/electron/dist

asar: true

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{ts,mjs,cts}'
  - '!{.eslintignore,.eslintrc.mjs,.prettierignore,.prettierrc.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/*.map'
  - '!**/*.md'
  # Strip dev/test artifacts from node_modules (saves ~5-8MB)
  - '!**/node_modules/*/{test,tests,docs,example,examples,coverage,__tests__}/**'
  - '!**/node_modules/*/{CHANGELOG*,changelog*,AUTHORS*,CONTRIBUTORS*}'
  - '!**/node_modules/*/{Makefile,README*,readme*}'
  # Strip TypeScript sources from node_modules
  - '!**/node_modules/**/*.ts'
  - '!**/node_modules/**/*.tsbuildinfo'

win:
  executableName: just-claw
  target:
    - target: nsis
      arch:
        - x64

compression: maximum

nsis:
  artifactName: just-claw-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: just-claw.${ext}

dmg:
  artifactName: just-claw.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: just-claw.${ext}

# Strip unused Chromium locale files (saves ~40MB)
afterPack: ./scripts/clean-locales.cjs

publish:
  provider: github
  owner: justclaw
  repo: justclaw
  releaseType: release
